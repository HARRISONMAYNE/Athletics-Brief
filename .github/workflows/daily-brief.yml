name: Daily Athletics Brief

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser pyyaml anthropic

      - name: Build and send the brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_brief.py

      - name: Publish to the site
        if: always()
        continue-on-error: true
        run: |
          git config user.name "athletics-brief-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet && echo "Nothing new to publish" && exit 0
          git commit -m "Daily brief"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main ||
